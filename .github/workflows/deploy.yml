name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to main)'
        required: false
        default: 'main'
        type: string
      services:
        description: 'Comma-separated services to force-rebuild (api,web,landing,all). Empty = let path-filter decide.'
        required: false
        default: ''
        type: string

concurrency:
  # Never run two deploys in parallel — they'd race on the server.
  group: deploy
  cancel-in-progress: false

jobs:
  # Phase 1: detect which services' source actually changed since the last
  # main commit. dorny/paths-filter compares the push's base..head; for
  # workflow_dispatch it diffs against the default branch's HEAD. Outputs
  # are consumed by the build-static + deploy jobs to decide what to rebuild.
  changes:
    name: detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      api:     ${{ steps.filter.outputs.api }}
      web:     ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
      infra:   ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `packages/shared/**` is folded into both `api` and `web` here
          # (those are the only consumers) so the deploy script doesn't
          # need a separate "shared" signal anymore.
          # `infra` changes (compose/nginx) recreate nginx, which is also
          # what static-only deploys do — so they're effectively a superset.
          # Root config (`pnpm-lock.yaml`, `package.json`, etc.) goes in
          # every per-app filter: a dep change could affect any service.
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'deploy/Dockerfile.api'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            landing:
              - 'apps/landing/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            infra:
              - 'deploy/docker-compose.yml'
              - 'deploy/nginx/**'

  # Phase 2 (parallel with deploy preparation): build the static frontends on
  # the GH runner whenever web or landing changed. The VPS never sees node /
  # pnpm anymore — only the rendered dist/ tarballs land there.
  build-static:
    name: build static frontends
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual: respect `services` input (build whatever is forced). Auto: respect path filter.
    if: |
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.landing == 'true' ||
      contains(inputs.services, 'web') ||
      contains(inputs.services, 'landing') ||
      inputs.services == 'all'
    outputs:
      # Echo gates downstream so the deploy job knows which artifacts exist.
      web_built:     ${{ steps.gate.outputs.web }}
      landing_built: ${{ steps.gate.outputs.landing }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute which static apps to build
        id: gate
        shell: bash
        env:
          CH_WEB:     ${{ needs.changes.outputs.web }}
          CH_LANDING: ${{ needs.changes.outputs.landing }}
          FORCE:      ${{ inputs.services }}
        run: |
          set -e
          web=false
          landing=false
          [ "$CH_WEB" = "true" ] && web=true
          [ "$CH_LANDING" = "true" ] && landing=true
          # `services` input — independent checks so all combinations work
          # (`all`, `web,landing`, `web`, etc.)
          [[ ",$FORCE," == *,all,* ]] && { web=true; landing=true; }
          [[ ",$FORCE," == *,web,* ]] && web=true
          [[ ",$FORCE," == *,landing,* ]] && landing=true
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          echo "→ web=$web landing=$landing"

      - uses: pnpm/action-setup@v3
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `web` imports @agent-platform/shared at build time, so compile shared
      # first whenever we build web.
      - name: Build shared (needed by web)
        if: steps.gate.outputs.web == 'true'
        run: pnpm --filter @agent-platform/shared build

      - name: Build web
        if: steps.gate.outputs.web == 'true'
        run: pnpm --filter @agent-platform/web build

      - name: Build landing
        if: steps.gate.outputs.landing == 'true'
        run: pnpm --filter @agent-platform/landing build

      # Tarball + upload. We tar the *contents* of dist (not the dir itself)
      # so the deploy script can `tar xzf` into a staging dir of its choice.
      - name: Tar web dist
        if: steps.gate.outputs.web == 'true'
        run: tar -czf web-dist.tar.gz -C apps/web/dist .

      - name: Tar landing dist
        if: steps.gate.outputs.landing == 'true'
        run: tar -czf landing-dist.tar.gz -C apps/landing/dist .

      - name: Upload web artifact
        if: steps.gate.outputs.web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 7

      - name: Upload landing artifact
        if: steps.gate.outputs.landing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing-dist.tar.gz
          retention-days: 7

  deploy:
    name: deploy to vps
    needs: [changes, build-static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    # Skip the whole deploy if nothing relevant changed AND it wasn't a
    # manual trigger. (workflow_dispatch always runs — useful for
    # forced redeploys / env-only changes.)
    # NOTE: `needs.build-static` is implicit; `always()` lets us proceed even
    # if build-static was skipped (api-only changes), but fail if build-static
    # itself errored.
    if: |
      always() &&
      (needs.build-static.result == 'success' || needs.build-static.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.api     == 'true' ||
        needs.changes.outputs.web     == 'true' ||
        needs.changes.outputs.landing == 'true' ||
        needs.changes.outputs.infra   == 'true'
      )

    steps:
      - name: Download web artifact
        if: needs.build-static.outputs.web_built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: artifacts/

      - name: Download landing artifact
        if: needs.build-static.outputs.landing_built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: artifacts/

      # Push the tarballs to the VPS in one shot (separate scp-action call so
      # missing artifacts don't break the SSH script later — the deploy
      # script's conditional unpack is gated on file presence).
      - name: scp static tarballs to VPS
        if: needs.build-static.outputs.web_built == 'true' || needs.build-static.outputs.landing_built == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          source:   'artifacts/*'
          target:   '/tmp/agent-platform-static/'
          strip_components: 1
          overwrite: true

      - name: SSH deploy — pull + targeted build + up + unpack static
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ inputs.ref || 'main' }}
          # Forward path-filter + build-static outputs into the SSH session.
          CHANGED_API:     ${{ needs.changes.outputs.api == 'true' }}
          CHANGED_INFRA:   ${{ needs.changes.outputs.infra == 'true' }}
          WEB_BUILT:       ${{ needs.build-static.outputs.web_built == 'true' }}
          LANDING_BUILT:   ${{ needs.build-static.outputs.landing_built == 'true' }}
          FORCE_SERVICES:  ${{ inputs.services }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_REF,CHANGED_API,CHANGED_INFRA,WEB_BUILT,LANDING_BUILT,FORCE_SERVICES
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"

            # ---- Sync source ----
            if [ ! -d .git ]; then
              echo ">>> first deploy — initialising git repo in place"
              git init
              git remote add origin https://github.com/indulgers/agent-platform.git
            fi

            # github.com from CN VPS is flaky on TLS — retry the fetch.
            git config --global http.postBuffer 524288000
            git config --global http.lowSpeedLimit 1000
            git config --global http.lowSpeedTime 30
            for attempt in 1 2 3 4 5; do
              echo ">>> git fetch attempt $attempt"
              if git fetch --depth=1 origin "$DEPLOY_REF"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "!!! git fetch failed after 5 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
            git reset --hard FETCH_HEAD
            git log -1 --oneline

            # ---- Unpack static frontends (before nginx recreate) ----
            # Each tarball was uploaded by the scp-action step into
            # /tmp/agent-platform-static/. We unpack into a /tmp staging
            # dir, then rsync --delete-after into the live /srv/*-dist
            # — file-level atomic, with deletes deferred until after all
            # writes complete so nothing referenced by the new index.html
            # is missing during the swap window.
            #
            # The live /srv dirs are bind-mounted into the nginx container
            # (compose.yml). Bootstrap them once on a fresh VPS:
            #   sudo mkdir -p /srv/web-dist /srv/landing-dist
            #   sudo chown deploy:deploy /srv/web-dist /srv/landing-dist
            # The script will exit with a clear error if these don't exist.
            STATIC_TMP=/tmp/agent-platform-static

            unpack_dist() {
              local name="$1"   # 'web' or 'landing'
              local tarball="$STATIC_TMP/${name}-dist.tar.gz"
              local staging="/tmp/agent-platform-${name}-staging"
              local live="/srv/${name}-dist"
              if [ ! -f "$tarball" ]; then
                echo ">>> no $name tarball — skip"
                return
              fi
              if [ ! -d "$live" ] || [ ! -w "$live" ]; then
                echo "!!! $live missing or not writable by $(whoami)" >&2
                echo "!!! Bootstrap once: sudo mkdir -p $live && sudo chown $(whoami):$(whoami) $live" >&2
                exit 1
              fi
              echo ">>> unpacking $name → $live"
              rm -rf "$staging"
              mkdir -p "$staging"
              tar -xzf "$tarball" -C "$staging"
              rsync -a --delete-after "$staging/" "$live/"
              rm -rf "$staging" "$tarball"
            }

            if [ "$WEB_BUILT" = "true" ]; then unpack_dist web; fi
            if [ "$LANDING_BUILT" = "true" ]; then unpack_dist landing; fi

            # ---- Decide which docker services to (re)build ----
            # Only api is built in docker now. web/landing are static.
            services=()
            if [ "$FORCE_SERVICES" = "all" ] || [ "$CHANGED_API" = "true" ]; then
              services+=(api)
            else
              IFS=',' read -ra forced <<< "$FORCE_SERVICES"
              for s in "${forced[@]}"; do
                s="${s// /}"
                if [ "$s" = "api" ]; then services+=(api); fi
              done
            fi

            echo "=============================="
            echo "Build plan:"
            echo "  CHANGED_API     = $CHANGED_API"
            echo "  CHANGED_INFRA   = $CHANGED_INFRA"
            echo "  WEB_BUILT       = $WEB_BUILT"
            echo "  LANDING_BUILT   = $LANDING_BUILT"
            echo "  FORCE_SERVICES  = '$FORCE_SERVICES'"
            echo "  → docker services to rebuild: ${services[*]:-(none)}"
            echo "=============================="

            # ---- Build + start ----
            COMPOSE="docker compose --env-file .env -f deploy/docker-compose.yml"

            if [ ${#services[@]} -gt 0 ]; then
              $COMPOSE build "${services[@]}"
              # --remove-orphans cleans up the (now-deleted) web/landing
              # containers from previous deploys.
              $COMPOSE up -d --remove-orphans "${services[@]}"
            fi

            # ---- nginx ----
            # If compose / nginx config changed, force-recreate nginx so the
            # new bind mounts + new server config take effect. Otherwise just
            # bounce it to pick up fresh dist/ files + re-resolve upstream DNS.
            if [ "$CHANGED_INFRA" = "true" ]; then
              echo ">>> infra changed — recreating nginx"
              $COMPOSE up -d --force-recreate --remove-orphans nginx
            elif [ ${#services[@]} -gt 0 ] || [ "$WEB_BUILT" = "true" ] || [ "$LANDING_BUILT" = "true" ]; then
              echo ">>> bouncing nginx (fresh dist or upstream change)"
              $COMPOSE restart nginx
            fi

            # Reap dangling images so disk doesn't bloat.
            docker image prune -f

            echo "--- running containers ---"
            $COMPOSE ps
