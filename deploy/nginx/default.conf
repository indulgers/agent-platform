# nginx is now the only HTTP layer: it serves both static frontends directly
# from bind-mounted dist/ directories (no inner web/landing containers anymore)
# and reverse-proxies /api/* to the api container.
#
# Build flow:
#   CI builds dist/ on a GH runner -> scp tarball to VPS -> unpacked into
#   /srv/{web,landing}-dist/ (bind-mounted here as /srv/web /srv/landing).
#
# Cache strategy mirrors the prior in-container nginx config:
#   - /assets/* are content-hashed (Vite) → lock for 1 year, immutable.
#   - HTML & SPA fallbacks are never cached → users never get stuck on a stale
#     index pointing at a stale bundle.
#
# Sibling-location pattern (not nested) for /app/assets/ vs /app/. nginx picks
# the longest-prefix match automatically, and avoids the alias+regex landmine.

upstream agent_api {
  server api:3000;
}

server {
  # 80 stays open so Cloudflare's "Flexible" SSL mode still works (and so
  # 'Always Use HTTPS' at the edge can 308 a stray HTTP visitor up to
  # HTTPS via Cloudflare's redirect, not ours).
  listen 80;
  # 443 with the Cloudflare Origin CA cert. CF→origin once SSL/TLS mode
  # is set to "Full (strict)" — CF validates this cert's chain (Cloudflare
  # Origin Root is auto-trusted on the CF side).
  listen 443 ssl http2;

  ssl_certificate     /etc/ssl/cloudflare/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;

  # Modern TLS only. CF supports 1.2+ and we lose nothing useful.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  server_name _;

  client_max_body_size 10m;

  # ---- API ---------------------------------------------------------------
  location /api/ {
    proxy_pass http://agent_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # SSE: never buffer, keep connections open.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;
  }

  # ---- SPA hashed assets (long cache) ---------------------------------
  # Vite filenames carry a content hash, so the URL is the cache key — safe
  # to lock forever. =404 (not SPA fallback) because a stale index pointing
  # at a deleted bundle should fail loudly, not silently serve HTML.
  location /app/assets/ {
    alias /srv/web/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- SPA shell (index.html + SPA routes) ----------------------------
  # `alias` strips the /app/ prefix; the unprefixed URI is resolved under
  # /srv/web/ (the bind mount of /srv/web-dist on the host).
  location /app/ {
    alias /srv/web/;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /app/index.html;
  }

  # Bare /app (no trailing slash) → redirect to /app/ so the SPA boots correctly.
  location = /app {
    return 301 /app/;
  }

  # ---- Landing hashed assets (long cache) ----------------------------
  location /assets/ {
    root /srv/landing;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- Landing (root) -------------------------------------------------
  location / {
    root /srv/landing;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
