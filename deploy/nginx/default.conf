# nginx is now the only HTTP layer: it serves both static frontends directly
# from bind-mounted dist/ directories (no inner web/landing containers anymore)
# and reverse-proxies /api/* to the api container.
#
# Build flow:
#   CI builds dist/ on a GH runner -> scp tarball to VPS -> unpacked into
#   /srv/{web,landing}-dist/ (bind-mounted here as /srv/web /srv/landing).
#
# Cache strategy mirrors the prior in-container nginx config:
#   - /assets/* are content-hashed (Vite) → lock for 1 year, immutable.
#   - HTML & SPA fallbacks are never cached → users never get stuck on a stale
#     index pointing at a stale bundle.

upstream agent_api {
  server api:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  # ---- API ---------------------------------------------------------------
  location /api/ {
    proxy_pass http://agent_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # SSE: never buffer, keep connections open.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;
  }

  # ---- SPA (/app/* → /srv/web) ------------------------------------------
  # Vite builds with base: '/app/', so HTML references /app/assets/... — the
  # `alias` directive strips /app/ before resolving on disk.
  location /app/ {
    alias /srv/web/;

    # Hashed bundle URLs change content-by-content → lock forever.
    location ~ ^/app/assets/ {
      alias /srv/web/assets/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA fallback: any non-file route returns the index, which itself is
    # served below with no-cache so users always re-validate on refresh.
    try_files $uri $uri/ /app/index.html;

    # index.html (and SPA fallbacks) must never sit in any cache.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Bare /app (no trailing slash) → 301 to /app/ so the SPA boots correctly.
  location = /app {
    return 301 /app/;
  }

  # ---- Marketing / landing (everything else) -----------------------------
  location / {
    root /srv/landing;

    # Long-cache the hashed-name assets the landing build emits.
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|webp|avif)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
